name: BabyCentric
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_svg: ^2.3.3
  pin_code_fields: ^10.1.1
  get: ^4.7.3
  carousel_slider: ^5.0.0
  http: ^1.6.0
  logger: ^2.8.0
  shared_preferences: ^2.3.5
  shimmer: ^4.0.0
  flutter_stripe: ^14.2.0
  internet_connection_checker_plus: ^3.1.2
  flutter_launcher_icons: ^0.14.4


dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0
flutter:

  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/favIcon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFF7ED"
  adaptive_icon_foreground: "assets/images/forground.png"



